name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Strictly check fixed image-base metadata code and tests
        run: >-
          pnpm exec tsc --ignoreConfig --noEmit --strict --allowJs --checkJs
          --module NodeNext --moduleResolution NodeNext --target ES2023
          --skipLibCheck --types node --typeRoots packages/cli/node_modules/@types
          scripts/fixture-image-base.mjs scripts/fixture-image-base.test.ts
          scripts/fixtures/image-base-metadata.mjs

      - name: Strictly check fixed image-layer code and tests
        run: >-
          pnpm exec tsc --ignoreConfig --noEmit --strict --allowJs --checkJs
          --module NodeNext --moduleResolution NodeNext --target ES2023
          --skipLibCheck --types node --typeRoots packages/cli/node_modules/@types
          scripts/fixture-image-layer-policy.mjs scripts/fixture-image-layer-policy.test.ts
          scripts/fixture-image-download.mjs scripts/fixture-image-download.test.ts
          scripts/verify-fixture-image-layers.mjs scripts/verify-fixture-image-layers.test.ts
          scripts/fixture-image-workflow.test.ts

      - name: Strictly check retained runtime boundary tests
        run: >-
          pnpm exec tsc --ignoreConfig --noEmit --strict --allowJs
          --module NodeNext --moduleResolution NodeNext --target ES2023
          --skipLibCheck --types node --typeRoots packages/cli/node_modules/@types
          scripts/runtime-build-process.test.ts scripts/runtime-build-source.test.ts
          scripts/prepare-fixture-runtime.test.ts scripts/runtime-archive-policy.test.ts
          scripts/runtime-assembly-inputs.test.ts scripts/package-policy.test.ts
          scripts/claude-artifact-download.test.ts scripts/claude-artifact-storage.test.ts
          scripts/runtime-tree.test.ts scripts/runtime-tree-reader.test.ts
          scripts/relocate-fixture-runtime.test.ts

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Verify package contents
        run: pnpm package:check

      - name: CLI smoke test
        run: pnpm agenthawk --help
